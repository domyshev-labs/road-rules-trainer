name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: go test ./backend/...
      - run: go vet ./backend/...
      - run: docker build --tag road-rules-trainer:ci .
