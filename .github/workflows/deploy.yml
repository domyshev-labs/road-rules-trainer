name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-rules-trainer-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      APP_NAME: road-rules-trainer
      APP_PORT: ${{ vars.ROAD_RULES_PORT || '5050' }}
      BIND_ADDRESS: ${{ vars.ROAD_RULES_BIND_ADDRESS || '127.0.0.1' }}
      IMAGE_NAME: road-rules-trainer:${{ github.sha }}
      DATA_VOLUME: road-rules-trainer-data

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select release version
        shell: bash
        run: |
          BASE_VERSION="$(sed -n 's/  "version": "\(.*\)",/\1/p' package.json)"
          VERSION="$(docker run --rm -i --env "BASE_VERSION=$BASE_VERSION" --env "RELEASE_TAGS=$(git tag --list 'v*')" --entrypoint node node:22-alpine --input-type=module - < scripts/next-release.mjs)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg "APP_VERSION=$APP_VERSION" --build-arg "GIT_SHA=$GITHUB_SHA" --tag "$IMAGE_NAME" .

      - name: Verify image
        shell: bash
        run: |
          docker rm --force "${APP_NAME}-check" 2>/dev/null || true
          docker run --detach --name "${APP_NAME}-check" "$IMAGE_NAME"

          for attempt in {1..20}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "${APP_NAME}-check")"
            if [ "$status" = healthy ]; then
              docker rm --force "${APP_NAME}-check"
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              docker logs "${APP_NAME}-check"
              docker rm --force "${APP_NAME}-check"
              exit 1
            fi
            sleep 1
          done

          docker logs "${APP_NAME}-check"
          docker rm --force "${APP_NAME}-check"
          exit 1

      - name: Back up database and prune verified backups
        shell: bash
        run: |
          docker run --rm -i --volume "${DATA_VOLUME}:/app/data" --env "RELEASE_ID=v${APP_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --entrypoint sh "$IMAGE_NAME" -s < scripts/backup-database.sh

      - name: Replace production container
        shell: bash
        run: |
          docker rm --force "$APP_NAME" 2>/dev/null || true
          docker run \
            --detach \
            --restart unless-stopped \
            --name "$APP_NAME" \
            --publish "${BIND_ADDRESS}:${APP_PORT}:8080" \
            --volume "${DATA_VOLUME}:/app/data" \
            --env "SESSION_SECRET=${{ secrets.ROAD_RULES_SESSION_SECRET }}" \
            --env "EMAIL_MODE=resend" \
            --env "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            --env "EMAIL_FROM=${{ vars.ROAD_RULES_EMAIL_FROM || 'Road Rules Trainer <login@mail.domyshev.com>' }}" \
            "$IMAGE_NAME"

      - name: Verify deployment
        shell: bash
        run: |
          for attempt in {1..20}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$APP_NAME")"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$APP_NAME"
          exit 1

      - name: Record successful release
        shell: bash
        run: |
          docker run --rm -i --env "APP_VERSION=$APP_VERSION" --env "GITHUB_SHA=$GITHUB_SHA" --env "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --env "RELEASE_HISTORY=$(cat backend/seed/releases.json)" --entrypoint node node:22-alpine --input-type=module - < scripts/record-release.mjs > release-record.json
          cp release-record.json backend/seed/releases.json
          docker exec -i "$APP_NAME" sh -c 'cat > /app/data/releases.json.tmp && mv /app/data/releases.json.tmp /app/data/releases.json' < release-record.json

      - name: Tag verified deployment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$APP_VERSION" "$GITHUB_SHA" --message "Production release v$APP_VERSION"
          git add backend/seed/releases.json
          git commit --message "Record production release v$APP_VERSION [skip ci]"
          git push --atomic origin HEAD:main "refs/tags/v$APP_VERSION"
          echo "Deployed v$APP_VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
